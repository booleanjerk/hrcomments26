<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Room Comments</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-generate {
            background-color: #3498db;
            color: white;
            flex: 2;
        }
        .btn-generate:hover {
            background-color: #2980b9;
        }
        .btn-copy {
            background-color: #2ecc71;
            color: white;
            flex: 1;
        }
        .btn-copy:hover {
            background-color: #27ae60;
        }
        .output-group {
            margin-top: 25px;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
            background-color: #fafafa;
        }
        .alert {
            display: none;
            margin-top: 10px;
            padding: 8px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Report Comment Generator</h2>
    
    <div class="form-group">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student's name...">
    </div>

    <div class="form-group">
        <label for="gender">Gender:</label>
        <select id="gender">
            <option value="male">Male</option>
            <option value="female" selected>Female</option>
        </select>
    </div>

    <div class="form-group">
        <label for="engagement">Engagement in House Session:</label>
        <select id="engagement">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>
    </div>

    <div class="form-group">
        <label for="maturity">Maturity:</label>
        <select id="maturity">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>
    </div>

    <div class="button-group">
        <button class="btn-generate" onclick="generateComment()">Generate</button>
        <button class="btn-copy" onclick="copyToClipboard()">Copy</button>
    </div>

    <div class="output-group">
        <label for="outputComment">Generated Comment:</label>
        <textarea id="outputComment" placeholder="Your generated comment will appear here..."></textarea>
        <div id="copyAlert" class="alert">Comment copied to clipboard!</div>
    </div>
</div>

<script>
    // --- STATEMENT BANK ---
    const engagementBank = {
        low: "[name] has shown limited engagement during House Sessions so far this year. [pronoun] often requires reminders to stay focused and participate in group activities.",
        medium: "[name] regularly engages actively in House Sessions. [pronoun] participates when prompted and contributes positively to the group dynamics.",
        high: "[name] demonstrates exceptional engagement in all House Sessions. [pronoun] enthusiastically takes the lead in activities and inspires peers to get involved."
    };

    const maturityBank = {
        low: "Regarding personal development, [name] has been inconsistent in demonstrating the College values, needing teacher input to guide appropriate behaviour. There are some clear avenues for growth.",
        medium: "[name] displays a steady level of maturity, approaching tasks responsibly and interacting respectfully with both peers and staff.",
        high: "[name] models a high level of maturity in daily interactions, consistently showing respect, integrity, and a commendable work ethic. [pronoun] is a delight to have in class."
    };

    // --- GENERATION LOGIC ---
    function generateComment() {
        const nameInput = document.getElementById('studentName').value.trim();
        const gender = document.getElementById('gender').value;
        const engagementLevel = document.getElementById('engagement').value;
        const maturityLevel = document.getElementById('maturity').value;

        const name = nameInput ? nameInput : "The student";
        const pronoun = (gender === 'male') ? 'He' : 'She';

        const introText = "In Homeroom, students explored the Keeping Safe: Child Protection Curriculum, applying protective strategies for resilience, persistence and assertiveness, and examining how to identify and manage risk across a range of real-world and online contexts.";
        const engagementText = engagementBank[engagementLevel];
        const maturityText = maturityBank[maturityLevel];

        let fullComment = `${introText} ${engagementText} ${maturityText}`;

        fullComment = fullComment.replace(/\[name\]/g, name);
        fullComment = fullComment.replace(/\[pronoun\]/g, pronoun);

        document.getElementById('outputComment').value = fullComment;
    }

    // --- COPY TO CLIPBOARD LOGIC ---
    function copyToClipboard() {
        const commentBox = document.getElementById('outputComment');
        
        if (!commentBox.value) {
            alert("Nothing to copy yet! Please generate a comment first.");
            return;
        }

        commentBox.select();
        commentBox.setSelectionRange(0, 99999);

        navigator.clipboard.writeText(commentBox.value).then(() => {
            const alertBox = document.getElementById('copyAlert');
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }
</script>

</body>
</html>
